# .github/workflows/test.yml - runs on every PR; make it a required check on main
name: test
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          ./build_linux.sh -u -d
      - run: |
          ./build_linux.sh -st && (cd build && ctest -C Release --output-on-failure)
