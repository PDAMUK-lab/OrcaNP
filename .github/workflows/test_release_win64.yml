name: Win64 test release

# Builds OrcaNP for Windows x64 and publishes it as a pre-release for testing. Runs when
# .github/test-release-win64 or this workflow changes on the polar non-planar branch, or by hand.
# The first line of .github/test-release-win64 is the release tag (bump it to request a new
# release); without that file the run only builds and tests. Changing this workflow also starts
# a build-only run.

on:
  push:
    branches:
      - claude/s4-slicer-parsing-tfwcjo
    paths:
      - '.github/test-release-win64'
      - '.github/workflows/test_release_win64.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_windows:
    name: Build Windows x64
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: windows-latest
      arch: x64
      compiler: clang
      build-deps-only: false
      force-build: false
    secrets: inherit

  unit_tests_windows:
    name: Unit tests Windows x64
    needs: build_windows
    uses: ./.github/workflows/unit_tests.yml
    with:
      os: windows-latest
      artifact: ${{ github.sha }}-tests-windows-x64

  release:
    name: Publish pre-release
    needs: [build_windows, unit_tests_windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: 'false'

      - name: Read release tag
        id: tag
        run: |
          tag=$(head -n 1 .github/test-release-win64 2>/dev/null | tr -d '[:space:]' || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          [ -n "$tag" ] || echo "No release tag in .github/test-release-win64; build only."

      - name: Download Windows build
        if: steps.tag.outputs.tag != ''
        uses: actions/download-artifact@v8
        with:
          pattern: OrcaSlicer_Windows_*
          path: artifacts

      - name: Create pre-release
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          portable=$(find artifacts -maxdepth 1 -type d -name 'OrcaSlicer_Windows_*_portable' | head -n 1)
          installer=$(find artifacts -type f -name 'OrcaSlicer*.exe' -not -path '*_portable/*' | head -n 1)
          [ -n "$portable" ] || { echo "::error::no portable build downloaded"; exit 1; }
          # A data_dir folder beside the executable makes it keep its settings and profiles there,
          # apart from any installed OrcaSlicer.
          mkdir -p "$portable/data_dir"
          (cd "$portable" && zip -qr "$GITHUB_WORKSPACE/OrcaNP_${tag}_Windows_x64_portable.zip" .)
          assets=("OrcaNP_${tag}_Windows_x64_portable.zip")
          if [ -n "$installer" ]; then
            cp "$installer" "OrcaNP_${tag}_Windows_x64_installer.exe"
            assets+=("OrcaNP_${tag}_Windows_x64_installer.exe")
          fi
          cat > notes.md <<EOF
          Test build of OrcaNP (${GITHUB_SHA}), a fork of OrcaSlicer for polar non-planar printing. Not for production use.

          **Windows x64, portable** (\`OrcaNP_${tag}_Windows_x64_portable.zip\`): unzip anywhere and run \`orca-slicer.exe\`. Settings and profiles stay in the \`data_dir\` folder next to it, apart from any installed OrcaSlicer.

          **Windows x64, installer** (\`OrcaNP_${tag}_Windows_x64_installer.exe\`): installs as OrcaSlicer, replacing an installed OrcaSlicer and sharing its settings. Prefer the portable build to keep both.

          The README (https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/README.md) explains every setting OrcaNP adds: what it is for and how to use it.

          New in this build:
          - Generated print surfaces are printed as support, to be thrown away, never solid: a pillar, dome or domed pillar, and the sphere or cylinder fitted to a cavity, get walls (Print settings > Quality > Non-planar (S4) > Wall loops), the support's base pattern and spacing inside, and its top interface pattern where they face the part, as many layers deep as the support's top interface layers (Support settings). They show as support in the preview and filament statistics. Print surface layer height prints them in thicker layers up to their top. Print surface parts you modelled keep their own part settings.
          - Polar alignment calibration (Calibration > Polar alignment): Create rings sets up two thin rings about the bed's rotation axis as a new project; print them, open Polar alignment again, enter their measured outer diameters and Apply to printer. Rings that come out too large mean the rotation axis is farther from the head's zero radius than the printer assumes, too small, nearer. The result goes into the printer's new Radius offset and Radius scale (Printer settings > Basic information > Polar kinematics); save the printer preset to keep them.

          Fixed since the previous test build:
          - A part on a generated pillar much narrower than it (a 3DBenchy on a stick) was printed in layers that wrapped around the pillar's rim, bending its bottom badly. Its layers are now flat over the pillar's top and slope down at the Cone angle beyond the rim; slicing warns if part of it hangs below those layers.

          Earlier features:
          - Supports on S4 parts: painted support enforcers and blockers are bent with the part, and support is printed in columns up to the real underside of the overhang it holds.
          - Printer structure Polar (Printer settings > Basic information > Advanced > Printer structure); the ThetaFirm Core R-Theta profile is Polar.
          - A warning before slicing when a part with the Optimized S4 layer shape has nothing overhanging more than the Maximum overhang.
          - Non-planar printing (Print settings > Quality > Non-planar (S4)): optimized S4 layers, conical layers, and layers offset from a print surface (support-like core parts, a generated sphere or cylinder fitted to the part's cavity, or a generated pillar, dome or domed pillar, with a surface gap all around).
          - Graded tetrahedral mesh for S4, on by default, and the Warm start and Multi-threading preferences (Preferences > General > Non-planar slicing).
          - Polar printers (Printer settings > Basic information > Printer structure Polar, Polar kinematics and Non-planar toolhead): machine G-code in bed angle, radius, Z and tilt with inverse time feed, tilt and radius travel limits, toolhead clearance checks.
          - Printer profile "ThetaFirm Core R-Theta" (Custom printers) for the Core R-Theta 4-axis printer with the ThetaFirm RepRapFirmware configuration.
          - Preview: the tool marker leans with the nozzle and shows the toolhead's clearance body (nozzle cone and head); for polar printers the marker's window shows the machine pose (bed angle, radius, tilt), "Turn bed" turns the bed and the print to the machine's angle at the current move, and the G-code window shows the machine G-code.
          - Preview playback: the play/pause button left of the moves slider runs through the print move by move and layer by layer at 1x to 1000x the estimated print time (click the speed to change it); it stops at the end or on pause.
          - Print surface parts: right-click a part in the object list > "Print surface (non-planar)". The print surface must be a part of the same object (Add part, or select both objects and Assemble).

          Known limitations:
          - The Non-planar toolhead defaults (50 degree clearance angle, 20 mm toolhead radius) describe no real toolhead: set them to yours before printing non-planar, most of all on a printer that cannot tilt the nozzle.
          - The Non-planar (S4) settings and the wall generator are Advanced settings: switch the process settings to Advanced (the toggle next to "Process") to see them.
          - The progress bar stays at 5% while a model is deformed for S4 (half a minute for 3DBenchy, minutes for complex models); it is working.
          - Offset from print surface layers all of the part by its distance from the print surface, so it suits parts printed over their print surface (domes, spheres, cups upside down, sleeves). Under a single overhang of a part standing on the bed (a bracket's arm), the rest of the part would be printed in vertical shells around the print surface, which the toolhead cannot reach; the clearance check warns. The generated sphere or cylinder needs a cavity open to the bed; other parts get a message saying so.
          - Support (Support settings) under a part printed in layers offset from a print surface is printed as the part's layers take it, not in columns; a generated print surface itself is printed as support.
          - Opening a polar .gcode file on its own (G-code viewer) shows it as Cartesian; preview polar prints after slicing them.
          - Offset layers meeting the bed stand vertical there; a tilting nozzle reaches them only within its tilt range, and the clearance check warns where the head would hit.
          - A non-planar object has one part printed non-planar (besides print surface parts) and one instance.
          EOF
          gh release create "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "OrcaNP ${tag}: polar non-planar (S4) test build, Windows x64" \
            --notes-file notes.md
