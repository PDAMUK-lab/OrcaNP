# .github/workflows/release.yml - runs when the agent pushes a vX.Y.Z tag
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag must be on main (never release an unreviewed commit)
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: |
          ./build_linux.sh -u -d
      - run: |
          ./build_linux.sh -st && (cd build && ctest -C Release --output-on-failure)
      - name: Package (output in dist/)
        run: |
          ./build_linux.sh -i && mkdir -p dist && find build -maxdepth 4 -name '*.AppImage' -exec cp -v {} dist/ +
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" dist/* --clobber
